<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>THE UNIVERSAL HIVE — Embed Bridge</title>
  <style>
    :root { --ink:#0A0A0A; --paper:#eeeee6; --moss:#C9A227; }
    body { margin:0; height:100dvh; background:var(--ink); color:var(--paper); font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace; }
    a { color:var(--moss); }
    .wrap { height:100dvh; display:grid; grid-template-rows:auto 1fr; }
    .bar { display:flex; gap:8px; align-items:center; padding:8px 10px; border-bottom:1px solid #22261f; background:rgba(12,13,11,.96); }
    .dot { width:6px; height:6px; border-radius:50%; background:#555; }
    .dot.up { background:var(--moss); box-shadow:0 0 6px var(--moss); }
    .bar .sp { flex:1; }
    iframe { width:100%; height:100%; border:0; background:#fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <span class="dot" id="dot"></span>
      <span id="stat">THE UNIVERSAL HIVE · embed</span>
      <span class="sp"></span>
      <a id="open-pages" target="_parent" rel="noopener">OPEN PAGES</a> ·
      <a id="open-here" href="./index.html" target="_parent" rel="noopener">OPEN SHELL</a>
    </div>
    <iframe id="if" allow="clipboard-read; clipboard-write; accelerometer; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
  </div>
  <script>
    const P = "https://KINGJACK1134.github.io/THE-UNIVERSAL-HIVE/";
    document.getElementById("open-pages").href = P;
    const ifr = document.getElementById("if");
    function test(url, cb) {
      try { const x = new XMLHttpRequest(); x.open("GET", url + "manifest.json?cb=" + Date.now(), true); x.timeout=2500; x.onload=()=>cb(x.status < 400); x.onerror=()=>cb(false); x.send(); } catch { cb(false); }
    }
    test(P, ok => {
      if (ok) { ifr.src = P; document.getElementById("dot").className="dot up"; document.getElementById("stat").textContent="loading: Pages"; }
      else { ifr.src = "./index.html"; document.getElementById("dot").className="dot up"; document.getElementById("stat").textContent="loading: local shell"; }
    });
  </script>
</body>
</html>
